networks:
  verbal:
    driver: bridge

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy
    networks:
      - verbal
    ports:
      - "4180:4180"
    volumes:
      - ./oauth2-proxy/authenticated-emails.txt:/etc/authenticated-emails.txt
      - ./assets/logo.png:/etc/verbal-logo.png
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://verbal:8501/"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/authenticated-emails.txt"
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: "/etc/verbal-logo.png"
    env_file:
      - ./oauth2-proxy/.env

  backend:
    build: ./backend
    networks:
      - verbal
    volumes:
      - .:/verbal
      - /home/amir/workspace:/workspace
    env_file:
      - ./backend/.env

  app:
    build: ./app
    networks:
      - verbal
    environment:
      BACKEND_URL: "http://backend:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
