<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    @font-face {
      font-family: 'RougeScript';
      src: url('RougeScript-Regular.ttf') format('truetype');
    }

    :root {
      --base03: light-dark(#fdf6e3, #002b36);
      --base02: light-dark(#eee8d5, #073642);
      --base01: light-dark(#93a1a1, #586e75);
      --base00: light-dark(#839496, #657b83);
      --base0: light-dark(#657b83, #839496);
      --base1: light-dark(#586e75, #93a1a1);
      --base2: light-dark(#073642, #eee8d5);
      --base3: light-dark(#002b36, #fdf6e3);
      --blue: #268bd2;
      --cyan: #2aa198;
      --orange: #cb4b16;
      --red: #dc322f;
      --unit: 1dvh;
    }

    html, body {
      height: calc(var(--unit) * 100);
      overscroll-behavior: none;
    }
    body {
      background: var(--base02);
      color: var(--base0);
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    body > * {
      margin-left: 10px;
      margin-right: 10px;
    }
    body > *:first-child {
      margin-top: 10px;
    }
    body > * {
      margin-bottom: 10px;
    }
    header {
      color: var(--base1);
      display: flex;
      align-items: center;
    }
    #appName {
      color: var(--base2);
      font-family: 'RougeScript', cursive;
      font-size: 28px;
      font-weight: 900;
    }
    header a, header button {
      background: none;
      border: none;
      color: var(--base1);
      font-size: 16px;
      text-decoration: none;
      margin-left: 10px;
      cursor: pointer;
    }
    header button:hover, header a:hover {
      color: var(--base2);
    }
    #themeToggle {
      padding: 6px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    #themeToggle:hover {
      background: var(--base01);
    }
    #themeToggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--base1);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #themeToggle #sun-icon {
      stroke-width: 3;
      #sun {
        stroke: none;
        fill: var(--base1);
      }
    }
    #themeToggle #moon-icon {
      stroke-width: 2;
    }
    #conversation {
      flex-grow: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .message {
      padding: 6px;
      white-space: pre-wrap;
      color: var(--base3);
    }
    .error-message {
      background: var(--red);
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      margin: 10px 0;
    }
    .user {
      margin: 10px 0px;
      padding: 10px;
      border-radius: 8px;
      background: var(--base01);
      min-width: calc(min(30em, calc(100vw - 40px)));
    }
    .tool-use {
      color: var(--base1);
      font-family: monospace;
      padding: 3px;
      margin-left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #spinner {
      width: 20px;
      height: 20px;
      margin: 10px;
      border: 2px solid var(--base01);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spinner 0.8s linear infinite;
      align-self: flex-start;
    }
    @keyframes spinner {
      to {transform: rotate(360deg);}
    }
    #inputArea {
      display: flex;
    }
    #messageInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid var(--base01);
      border-radius: 4px;
      background: var(--base03);
      color: var(--base2);
    }
    #messageInput::placeholder {
      color: var(--base01);
    }
    #messageInput:focus {
      outline: none;
      border-color: var(--base1);
    }
    #sendButton {
      padding: 10px 20px;
      margin-left: 10px;
      background: var(--orange);
      color: var(--base3);
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    #sendButton:hover {
      background: var(--red);
    }
  </style>
</head>
<body>
  <header>
    <span style="flex-grow: 1"></span>
    <span id="appName">Verbal</span>
    <span style="flex-grow: 2"></span>
    <button id="themeToggle">
      <svg id="sun-icon" viewBox="0 0 24 24">
        <path d="M18 12a6 6 0 1 1-12 0 6 6 0 1 1 12 0z" id="sun" />
        <path d="M20.315 15.444 L22.163 16.21 M15.444 20.315 L16.21 22.163 M8.5558 20.315 L7.7905 22.163 M3.6851 15.444 L1.8373 16.21 M3.6851 8.5558 L1.8373 7.7905 M8.5558 3.6851 L7.7905 1.8373 M15.444 3.6851 L16.21 1.8373 M20.315 8.5558 L22.163 7.7905"/>
      </svg>
      <svg id="moon-icon" viewBox="0 0 24 24">
        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454"/>
      </svg>
    </button>
    <button id="restartButton">Restart</button>
  </header>
  <div id="conversation">
    <!-- Conversation messages will be appended here -->
  </div>
  <form id="messageForm">
    <div id="inputArea">
      <input type="text" id="messageInput" name="message" placeholder="Type your command here..." required autofocus />
      <button type="submit" id="sendButton">Send</button>
    </div>
  </form>
  <script>
    "use strict";

    let previous_adapt_ts = null;
    function adapt_to_window_size() {
        window.requestAnimationFrame(function (ts) {
            if (ts === previous_adapt_ts)
                return;

            document.documentElement.style.setProperty('--unit', `${0.01 * window.visualViewport.height}px`);
            previous_adapt_ts = ts;
        });
    }
    adapt_to_window_size();
    window.visualViewport.addEventListener('resize', adapt_to_window_size);

    // Theme handling
    const themeToggle = document.getElementById('themeToggle');

    function setTheme(theme) {
      document.body.style.colorScheme = theme;
      localStorage.setItem('theme', theme);
      document.getElementById('sun-icon').style.display = theme === 'dark' ? 'none' : 'block';
      document.getElementById('moon-icon').style.display = theme === 'dark' ? 'block' : 'none';
    }

    // Check for saved theme preference, otherwise use system preference
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const defaultTheme = savedTheme || (prefersDark ? 'dark' : 'light');
    
    // Set initial theme
    setTheme(defaultTheme);

    // Toggle theme when button is clicked
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.style.colorScheme;
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Function to handle event stream requests
    async function handleEventStream(url, postData, onEvent, onDone) {
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify(postData)
        });

        if (!response.body) {
          throw new Error("ReadableStream not supported");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          
          for (const line of lines) {
            if (line.trim() === '' || !line.startsWith('data: ')) continue;
            
            try {
              const data = JSON.parse(line.slice(6));
              onEvent(data);
            } catch (err) {
              console.error("Error parsing event data:", err);
              onDone();
              return;
            }
          }
        }
      } catch (err) {
        console.error("Event stream error:", err);
      }
      onDone();
    }

    function renderMessage(message) {
      switch (message.type) {
        case 'text':
          {
            const elt = document.createElement('div');
            elt.className = 'message assistant';
            elt.textContent = message.text;
            return elt;
          }

        case 'tool_use':
          {
            const elt = document.createElement('div');
            elt.className = 'message tool-use';
            const toolsIcon = document.createElement('span');
            toolsIcon.textContent = '🛠';
            elt.appendChild(toolsIcon);
            const toolCall = document.createElement('span');
            toolCall.textContent = `${message.name}: ${JSON.stringify(message.input)}`;
            elt.appendChild(toolCall);
            return elt;
          }

        case 'error':
          {
            const elt = document.createElement('pre');
            elt.className = 'message error-message';
            elt.textContent = message.message;
            return elt;
          }
      }
      return null;
    }

    // Chat response handler
    function handleChatResponse(data) {
      const elt = renderMessage(data);
      if (elt) {
        const conversation = document.getElementById('conversation');
        const spinner = document.getElementById('spinner');
        conversation.insertBefore(elt, spinner);
      }
      conversation.scrollTop = conversation.scrollHeight;
    }

    // Handle form submission
    document.getElementById('messageForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();
      if(messageText === "") return;

      const conversation = document.getElementById('conversation');

      // Append user's message
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = messageText;
      conversation.appendChild(userMessage);
      
      // Add initial spinner
      const spinner = document.createElement('div');
      spinner.id = 'spinner';
      conversation.appendChild(spinner);
      
      conversation.scrollTop = conversation.scrollHeight;

      // Clear the input field
      input.value = "";

      handleEventStream(
        "/api/chat",
        {type: "text", text: messageText},
        handleChatResponse,
        () => {document.getElementById('spinner').remove()}
      );
    });

    // Function to check if the service is healthy
    async function checkHealth(maxAttempts = 30, interval = 1000) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const response = await fetch('/api/health');
          if (response.ok) {
            const data = await response.json();
            if (data.status === 'ok') {
              return true;
            }
          }
        } catch (error) {
          console.log('Health check failed:', error);
        }
        await new Promise(resolve => setTimeout(resolve, interval));
      }
      return false;
    }

    // Restart button clears the conversation when clicked
    document.getElementById('restartButton').addEventListener('click', async function() {
      if(confirm('Are you sure you want to restart the conversation?')) {
        try {
          const response = await fetch('/api/redeploy', { method: 'POST' });
          const data = await response.json();
        } catch (error) {
          alert('Error redeploying: ' + error.message);
        }

      // Clear the conversation
        document.getElementById('conversation').innerHTML = '';
        
        // Show a loading message
        const loadingMessage = document.createElement('div');
        loadingMessage.className = 'message';
        loadingMessage.textContent = 'Waiting for service to restart...';
        document.getElementById('conversation').appendChild(loadingMessage);
        
        // Delete the session cookie
        document.cookie = 'session_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        
        // Wait for the service to be healthy
        const isHealthy = await checkHealth();
        if (isHealthy) {
          window.location.reload();
        } else {
          alert('Service failed to restart after 30 seconds');
        }
      }
    });
  </script>
</body>
</html>
