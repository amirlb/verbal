<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbal Chat</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    /* Theme variables */
    :root[data-theme="dark"] {
      --base03: #002b36;
      --base02: #073642;
      --base01: #586e75;
      --base00: #657b83;
      --base0: #839496;
      --base1: #93a1a1;
      --base2: #eee8d5;
      --base3: #fdf6e3;
      --blue: #268bd2;
      --cyan: #2aa198;
    }

    :root[data-theme="light"] {
      --base03: #fdf6e3;
      --base02: #eee8d5;
      --base01: #93a1a1;
      --base00: #839496;
      --base0: #657b83;
      --base1: #586e75;
      --base2: #073642;
      --base3: #002b36;
      --blue: #268bd2;
      --cyan: #2aa198;
    }

    /* Mobile-first styling */
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100%;
      background: var(--base03);
      color: var(--base0);
    }
    header {
      background: var(--base02);
      color: var(--base1);
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a, header button {
      background: none;
      border: none;
      color: var(--base1);
      font-size: 16px;
      text-decoration: none;
      margin-left: 10px;
      cursor: pointer;
    }
    header button:hover, header a:hover {
      color: var(--base2);
    }
    #themeToggle {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    #themeToggle:hover {
      background: var(--base01);
    }
    #themeToggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--base1);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #themeToggle .moon-icon {
      display: none;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 50px); /* subtract header height */
    }
    #conversation {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: var(--base02);
    }
    .message {
      max-width: 80%;
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
      word-wrap: break-word;
    }
    .user {
      background: var(--base01);
      color: var(--base3);
      align-self: flex-end;
      margin-left: auto;
    }
    .assistant {
      background: var(--base02);
      border: 1px solid var(--base01);
      color: var(--base1);
      align-self: flex-start;
      margin-right: auto;
    }
    #inputArea {
      display: flex;
      padding: 10px;
      border-top: 1px solid var(--base01);
      background: var(--base02);
    }
    #messageInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid var(--base01);
      border-radius: 4px;
      background: var(--base03);
      color: var(--base1);
    }
    #messageInput::placeholder {
      color: var(--base01);
    }
    #sendButton {
      padding: 10px 20px;
      margin-left: 10px;
      background: var(--blue);
      color: var(--base3);
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    #sendButton:hover {
      background: var(--cyan);
    }
    /* Desktop adjustments */
    @media (min-width: 768px) {
      #conversation {
        padding: 20px;
      }
      #messageInput, #sendButton {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>Verbal Chat</strong>
    </div>
    <div>
      <button id="themeToggle">
        <svg class="sun-icon" viewBox="0 0 24 24">
          <path d="M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3zm0-2V4m0 16v-3M4 12H1m22 0h-3M5.64 5.64L3.5 3.5m16.36.14l-2.14 2.14M5.64 18.36L3.5 20.5m16.36-.14l-2.14-2.14"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24">
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>
        </svg>
      </button>
      <a href="about.html">About</a>
      <button id="restartButton">Restart</button>
    </div>
  </header>
  <div id="container">
    <div id="conversation">
      <!-- Conversation messages will be appended here -->
    </div>
    <form id="messageForm">
      <div id="inputArea">
        <input type="text" id="messageInput" name="message" placeholder="Type your command here..." required autofocus />
        <button type="submit" id="sendButton">Send</button>
      </div>
    </form>
  </div>
  <script>
    // Theme handling
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    
    // Check for saved theme preference, otherwise use system preference
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const defaultTheme = savedTheme || (prefersDark ? 'dark' : 'light');
    
    // Set initial theme
    setTheme(defaultTheme);
    
    function setTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      
      // Update toggle button icons
      const sunIcon = themeToggle.querySelector('.sun-icon');
      const moonIcon = themeToggle.querySelector('.moon-icon');
      if (theme === 'dark') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }
    
    // Toggle theme when button is clicked
    themeToggle.addEventListener('click', () => {
      const currentTheme = root.getAttribute('data-theme');
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Handle form submission using fetch and process SSE stream
    document.getElementById('messageForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();
      if(messageText === "") return;

      const conversation = document.getElementById('conversation');

      // Append user's message
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = messageText;
      conversation.appendChild(userMessage);
      conversation.scrollTop = conversation.scrollHeight;

      // Clear the input field
      input.value = "";

      // Append placeholder for assistant's reply
      const assistantMessage = document.createElement('div');
      assistantMessage.className = 'message assistant';
      assistantMessage.textContent = "";
      conversation.appendChild(assistantMessage);
      conversation.scrollTop = conversation.scrollHeight;

      // Prepare payload according to chat API spec
      const payload = {
        type: "text",
        text: messageText
      };

      try {
        const response = await fetch("http://localhost:3000/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify(payload)
        });

        if (!response.body) {
          console.error("ReadableStream not supported");
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          console.log([done, value]);
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\r\n\r\n');
          buffer = parts.pop();
          for (const part of parts) {
            if (part.trim() === "") continue;
            const lines = part.split("\r\n");
            let dataStr = "";
            for (const line of lines) {
              if (line.startsWith("data:")) {
                dataStr += line.slice(5).trim();
              }
            }
            try {
              console.log(dataStr);
              const eventObj = JSON.parse(dataStr);
              if (eventObj.type === "text") {
                assistantMessage.textContent += eventObj.text;
                conversation.scrollTop = conversation.scrollHeight;
              }
            } catch (err) {
              console.error("Error parsing SSE event", err);
            }
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    });

    // Restart button clears the conversation when clicked
    document.getElementById('restartButton').addEventListener('click', function() {
      if(confirm('Are you sure you want to restart the conversation?')) {
        document.getElementById('conversation').innerHTML = '';
      }
    });
  </script>
</body>
</html>
