<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbal Chat</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    /* Solarized theme */
    :root {
      --base03: light-dark(#fdf6e3, #002b36);
      --base02: light-dark(#eee8d5, #073642);
      --base01: light-dark(#93a1a1, #586e75);
      --base00: light-dark(#839496, #657b83);
      --base0: light-dark(#657b83, #839496);
      --base1: light-dark(#586e75, #93a1a1);
      --base2: light-dark(#073642, #eee8d5);
      --base3: light-dark(#002b36, #fdf6e3);
      --blue: #268bd2;
      --cyan: #2aa198;
      --orange: #cb4b16;
      --red: #dc322f;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100%;
      background: var(--base03);
      color: var(--base0);
    }
    header {
      background: var(--base02);
      color: var(--base1);
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a, header button {
      background: none;
      border: none;
      color: var(--base1);
      font-size: 16px;
      text-decoration: none;
      margin-left: 10px;
      cursor: pointer;
    }
    header button:hover, header a:hover {
      color: var(--base2);
    }
    #themeToggle {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    #themeToggle:hover {
      background: var(--base01);
    }
    #themeToggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--base1);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #themeToggle #sun-icon {
      stroke-width: 3;
      #sun {
        stroke: none;
        fill: var(--base1);
      }
    }
    #themeToggle #moon-icon {
      stroke-width: 2;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 50px); /* subtract header height */
    }
    #conversation {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: var(--base02);
    }
    .message {
      max-width: 80%;
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
      word-wrap: break-word;
    }
    .user {
      background: var(--base01);
      color: var(--base3);
      align-self: flex-end;
      margin-left: auto;
    }
    .assistant {
      background: var(--base02);
      border: 1px solid var(--base01);
      color: var(--base1);
      align-self: flex-start;
      margin-right: auto;
    }
    #inputArea {
      display: flex;
      padding: 10px;
      border-top: 1px solid var(--base01);
      background: var(--base02);
    }
    #messageInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid var(--base01);
      border-radius: 4px;
      background: var(--base03);
      color: var(--base1);
    }
    #messageInput::placeholder {
      color: var(--base01);
    }
    #sendButton {
      padding: 10px 20px;
      margin-left: 10px;
      background: var(--orange);
      color: var(--base3);
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    #sendButton:hover {
      background: var(--red);
    }
  </style>
</head>
<body>
  <header>
    <span style="font-size: 24px; font-weight: bold; flex-grow: 1;">Verbal Chat</span>
    <button id="themeToggle">
      <svg id="sun-icon" viewBox="0 0 24 24">
        <path d="M18 12a6 6 0 1 1-12 0 6 6 0 1 1 12 0z" id="sun" />
        <path d="M20.315 15.444 L22.163 16.21 M15.444 20.315 L16.21 22.163 M8.5558 20.315 L7.7905 22.163 M3.6851 15.444 L1.8373 16.21 M3.6851 8.5558 L1.8373 7.7905 M8.5558 3.6851 L7.7905 1.8373 M15.444 3.6851 L16.21 1.8373 M20.315 8.5558 L22.163 7.7905"/>
      </svg>
      <svg id="moon-icon" viewBox="0 0 24 24">
        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454"/>
      </svg>
    </button>
    <a href="about.html">About</a>
    <button id="restartButton">Restart</button>
  </header>
  <div id="container">
    <div id="conversation">
      <!-- Conversation messages will be appended here -->
    </div>
    <form id="messageForm">
      <div id="inputArea">
        <input type="text" id="messageInput" name="message" placeholder="Type your command here..." required autofocus />
        <button type="submit" id="sendButton">Send</button>
      </div>
    </form>
  </div>
  <script>
    "use strict";
    // Theme handling
    const themeToggle = document.getElementById('themeToggle');

    function setTheme(theme) {
      document.body.style.colorScheme = theme;
      localStorage.setItem('theme', theme);
      document.getElementById('sun-icon').style.display = theme === 'dark' ? 'none' : 'block';
      document.getElementById('moon-icon').style.display = theme === 'dark' ? 'block' : 'none';
    }

    // Check for saved theme preference, otherwise use system preference
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const defaultTheme = savedTheme || (prefersDark ? 'dark' : 'light');
    
    // Set initial theme
    setTheme(defaultTheme);

    // Toggle theme when button is clicked
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.style.colorScheme;
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Handle form submission using fetch and process SSE stream
    document.getElementById('messageForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();
      if(messageText === "") return;

      const conversation = document.getElementById('conversation');

      // Append user's message
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = messageText;
      conversation.appendChild(userMessage);
      conversation.scrollTop = conversation.scrollHeight;

      // Clear the input field
      input.value = "";

      // Append placeholder for assistant's reply
      const assistantMessage = document.createElement('div');
      assistantMessage.className = 'message assistant';
      assistantMessage.textContent = "";
      conversation.appendChild(assistantMessage);
      conversation.scrollTop = conversation.scrollHeight;

      // Prepare payload according to chat API spec
      const payload = {
        type: "text",
        text: messageText
      };

      try {
        const response = await fetch("http://localhost:3000/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify(payload)
        });

        if (!response.body) {
          console.error("ReadableStream not supported");
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          console.log([done, value]);
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\r\n\r\n');
          buffer = parts.pop();
          for (const part of parts) {
            if (part.trim() === "") continue;
            const lines = part.split("\r\n");
            let dataStr = "";
            for (const line of lines) {
              if (line.startsWith("data:")) {
                dataStr += line.slice(5).trim();
              }
            }
            try {
              console.log(dataStr);
              const eventObj = JSON.parse(dataStr);
              if (eventObj.type === "text") {
                assistantMessage.textContent += eventObj.text;
                conversation.scrollTop = conversation.scrollHeight;
              }
            } catch (err) {
              console.error("Error parsing SSE event", err);
            }
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    });

    // Restart button clears the conversation when clicked
    document.getElementById('restartButton').addEventListener('click', function() {
      if(confirm('Are you sure you want to restart the conversation?')) {
        document.getElementById('conversation').innerHTML = '';
      }
    });
  </script>
</body>
</html>
