<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    main {
      padding: 10px;
      box-sizing: border-box;
      gap: 10px;
    }
    .content-container {
      flex-grow: 1;
      overflow: auto;
      margin-top: 50px;
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    @media (max-width: 768px) {
      .content-container {
        flex-direction: column;
      }
      .files-section {
        height: calc(var(--unit) * 35);
      }
    }
    section {
      border-radius: 8px;
      background: var(--base02);
    }
    .control-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }
    .control-buttons button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    #newSession {
        background: var(--orange);
        color: var(--base3);
    }
    #newSession:hover {
        background: var(--red);
    }
    #redeploy {
        background: var(--base01);
        color: var(--base3);
    }
    #redeploy:hover {
        background: var(--base1);
    }
    section {
        flex: 1;
        background: var(--base03);
        border-radius: 8px;
        padding: 10px;
    }
    section h2 {
        color: var(--base2);
        margin: 0 0 20px 0;
        font-size: 18px;
    }
    #sessionsList {
      list-style: none;
      padding: 0;
    }
    #sessionsList > li > a {
        background: var(--base02);
        border-radius: 6px;
        padding: 15px;
        margin-top: 10px;
        transition: background-color 0.2s;
        display: flex;
        flex-direction: column;
        gap: 5px;
        text-decoration: none;
        color: inherit;
    }
    #sessionsList > li > a:hover {
        background: var(--base01);
    }
    #sessionsList > li:first-child > a {
        padding: 24px;
    }
    .message-count {
        color: var(--base2);
        font-weight: bold;
    }
    .last-message {
        color: var(--base1);
        font-size: 14px;
    }
    .files-content {
        color: var(--base1);
    }
  </style>
</head>
<body>
  <header>
    <span id="appName">Verbal</span>
    <span style="flex-grow: 1"></span>
    <div class="hamburger-menu">
      <button class="menu-button" id="menuToggle">
        <svg viewBox="0 0 24 24">
          <path d="M3 6h18M3 13h18M3 20h18" />
        </svg>
      </button>
      <div class="menu-content">
        <button class="menu-item" id="themeToggle">
          <svg id="sun-icon" viewBox="0 0 24 24">
            <path d="M18 12a6 6 0 1 1-12 0 6 6 0 1 1 12 0z" id="sun" />
            <path d="M20.315 15.444 L22.163 16.21 M15.444 20.315 L16.21 22.163 M8.5558 20.315 L7.7905 22.163 M3.6851 15.444 L1.8373 16.21 M3.6851 8.5558 L1.8373 7.7905 M8.5558 3.6851 L7.7905 1.8373 M15.444 3.6851 L16.21 1.8373 M20.315 8.5558 L22.163 7.7905"/>
          </svg>
          <svg id="moon-icon" viewBox="0 0 24 24">
            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454"/>
          </svg>
          <span>Theme</span>
        </button>
        <div class="separator"></div>
        <div class="user-info">
          <div>Signed in as</div>
          <div class="user-email">Loading...</div>
        </div>
        <a href="/oauth2/sign_out" class="menu-item">
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
          Sign out
        </a>
      </div>
    </div>
  </header>
  <main>
    <div class="content-container">
      <section class="files-section">
        <h2>Files</h2>
        <div class="files-content">
          TBD
        </div>
      </section>
      <section class="sessions-section">
        <h2>Sessions</h2>
        <ul id="sessionsList">
          <li><a href="chat.html">Start new session</a></li>
        </ul>
      </section>
    </div>
    <div class="control-buttons">
      <button id="redeploy">Re-deploy</button>
    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    "use strict";

    // Menu handling
    const menuToggle = document.getElementById('menuToggle');
    const menuContent = menuToggle.nextElementSibling;
    
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      menuContent.classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!menuContent.contains(e.target) && !menuToggle.contains(e.target)) {
        menuContent.classList.remove('active');
      }
    });

    // Load user info
    async function loadUserInfo() {
      try {
        const response = await fetch('/api/whoami');
        const data = await response.json();
        document.querySelector('.user-email').textContent = data.email;
      } catch (error) {
        console.error('Failed to load user info:', error);
        document.querySelector('.user-email').textContent = 'Error loading user info';
      }
    }

    // Load sessions
    async function loadSessions() {
      try {
        const response = await fetch('/api/conversations');
        const data = await response.json();
        const sessionsList = document.getElementById('sessionsList');
        sessionsList.innerHTML = '<li><a href="chat.html">Start new session</a></li>';
        
        const sessionIds = Object.keys(data.conversations);
        sessionIds.sort((a, b) => data.conversations[b].last_message_at - data.conversations[a].last_message_at);
        for (const id of sessionIds) {
          const info = data.conversations[id];
          const li = document.createElement('li');
          li.innerHTML = `<a href="chat.html?session=${encodeURIComponent(id)}">
            <span class="message-count">${info.message_count} messages</span>
            <span class="last-message">Last message: ${new Date(info.last_message_at * 1000).toLocaleString()}</span>
          </a>`;
          sessionsList.appendChild(li);
        }
      } catch (error) {
        console.error('Failed to load sessions:', error);
      }
    }

    // Function to check if the service is healthy
    async function checkHealth(maxAttempts = 5, interval = 1000) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const response = await fetch('/api/health');
          if (response.ok) {
            const data = await response.json();
            if (data.status === 'ok') {
              return true;
            }
          }
        } catch (error) {
          console.log('Health check failed:', error);
        }
        await new Promise(resolve => setTimeout(resolve, interval));
      }
      return false;
    }

    document.getElementById('redeploy').addEventListener('click', async (event) => {
      event.target.disabled = true;
      if (confirm('Are you sure you want to re-deploy the service?')) {
        try {
          const response = await fetch('/api/redeploy', { method: 'POST' });
          await response.json();
        } catch (error) {
          alert('Error redeploying: ' + error.message);
        }
        alert('Successful redeployment: ' + error.message);

        // Wait for the service to be healthy
        const isHealthy = await checkHealth();
        if (isHealthy) {
          window.location.reload();
        } else {
          alert('Service failed to restart after 5 seconds');
        }
      }
      event.target.enabled = true;
    });

    // Initial load
    loadSessions();
    loadUserInfo();
    // Refresh sessions every 30 seconds
    setInterval(loadSessions, 30000);
  </script>
</body>
</html>
