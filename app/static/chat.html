<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    #conversation {
        padding: 10px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .message {
        padding: 6px;
        white-space: pre-wrap;
        color: var(--base3);
    }
    .error-message {
        background: var(--red);
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        margin: 10px 0;
    }
    .user {
        margin: 10px 0px;
        padding: 10px;
        border-radius: 8px;
        background: var(--base01);
        min-width: calc(min(30em, calc(100vw - 40px)));
    }
    .tool-use {
        color: var(--base1);
        font-family: monospace;
        padding: 3px;
        margin-left: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #spinner {
        width: 20px;
        height: 20px;
        margin: 10px;
        border: 2px solid var(--base01);
        border-top-color: var(--cyan);
        border-radius: 50%;
        animation: spinner 0.8s linear infinite;
        align-self: flex-start;
    }
    @keyframes spinner {
        to {transform: rotate(360deg);}
    }
    #messageInput {
        min-height: 36px;
        max-height: 100px;
        overflow-y: auto;
        padding: 10px;
        font-size: 16px;
        border-top: 1px solid var(--base01);
        border-radius: 8px 8px 0 0;
        background: var(--base03);
        color: var(--base2);
    }
    #messageInput:empty::before {
        color: var(--base01);
        content: "Type your command here...";
    }
    #messageInput:focus {
        outline: none;
    }
    #sendButton {
        padding: 10px 20px;
        margin-left: 10px;
        background: var(--orange);
        color: var(--base3);
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }
    #sendButton:hover {
        background: var(--red);
    }
  </style>
</head>
<body>
  <header>
    <span style="flex-grow: 1"></span>
    <a id="appName" href="./">Verbal</a>
    <span style="flex-grow: 2"></span>
    <button id="themeToggle">
      <svg id="sun-icon" viewBox="0 0 24 24">
        <path d="M18 12a6 6 0 1 1-12 0 6 6 0 1 1 12 0z" id="sun" />
        <path d="M20.315 15.444 L22.163 16.21 M15.444 20.315 L16.21 22.163 M8.5558 20.315 L7.7905 22.163 M3.6851 15.444 L1.8373 16.21 M3.6851 8.5558 L1.8373 7.7905 M8.5558 3.6851 L7.7905 1.8373 M15.444 3.6851 L16.21 1.8373 M20.315 8.5558 L22.163 7.7905"/>
      </svg>
      <svg id="moon-icon" viewBox="0 0 24 24">
        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454"/>
      </svg>
    </button>
  </header>
  <main>
    <div style="flex-grow: 1"></div>
    <div id="conversation"></div>
    <div id="messageInput" contenteditable autofocus></div>
  </main>
  <script src="/common.js"></script>
  <script>
    "use strict";

    let currentSessionId = new URLSearchParams(window.location.search).get('session');

    // Function to load conversation history
    async function loadConversationHistory() {
      if (!currentSessionId) return;
      
      try {
        const response = await fetch(`/api/conversations/${encodeURIComponent(currentSessionId)}`);
        if (!response.ok) {
          if (response.status === 404) {
            alert('Conversation not found');
            window.location.href = 'chat.html';
            return;
          }
          throw new Error(`Failed to load conversation: ${response.statusText}`);
        }

        const data = await response.json();
        const conversation = document.getElementById('conversation');
        
        for (const message of data.messages) {
          if (message.role === 'user') {
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = message.content.text;
            conversation.appendChild(userMessage);
          } else {
            const elt = renderMessage(message.content);
            if (elt) {
              conversation.appendChild(elt);
            }
          }
        }
        
        conversation.scrollTop = conversation.scrollHeight;
      } catch (error) {
        console.error('Failed to load conversation history:', error);
        const errorMessage = document.createElement('pre');
        errorMessage.className = 'message error-message';
        errorMessage.textContent = 'Failed to load conversation history: ' + error.message;
        document.getElementById('conversation').appendChild(errorMessage);
      }
    }

    // Function to handle event stream requests
    async function handleEventStream(url, postData, onEvent, onDone) {
      try {
        // Add session ID to post data if it exists
        if (currentSessionId) {
          postData.session_id = currentSessionId;
        }

        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify(postData)
        });

        if (!response.body) {
          throw new Error("ReadableStream not supported");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          
          for (const line of lines) {
            if (line.trim() === '' || !line.startsWith('data: ')) continue;
            
            try {
              const data = JSON.parse(line.slice(6));
              onEvent(data);
            } catch (err) {
              console.error("Error parsing event data:", err);
              onDone();
              return;
            }
          }
        }
      } catch (err) {
        console.error("Event stream error:", err);
      }
      onDone();
    }

    function renderMessage(message) {
      switch (message.type) {
        case 'session_id':
          currentSessionId = message.session_id;
          // Update URL without reloading the page
          const newUrl = new URL(window.location);
          newUrl.searchParams.set('session', currentSessionId);
          window.history.pushState({}, '', newUrl);
          return;

        case 'text':
          {
            const elt = document.createElement('div');
            elt.className = 'message assistant';
            elt.textContent = message.text;
            return elt;
          }

        case 'tool_use':
          {
            const elt = document.createElement('div');
            elt.className = 'message tool-use';
            const toolsIcon = document.createElement('span');
            toolsIcon.textContent = '🛠';
            elt.appendChild(toolsIcon);
            const toolCall = document.createElement('span');
            toolCall.textContent = `${message.name}: ${JSON.stringify(message.input)}`;
            elt.appendChild(toolCall);
            return elt;
          }

        case 'error':
          {
            const elt = document.createElement('pre');
            elt.className = 'message error-message';
            elt.textContent = message.message;
            return elt;
          }
      }
      return null;
    }

    // Chat response handler
    function handleChatResponse(data) {
      const elt = renderMessage(data);
      if (elt) {
        const conversation = document.getElementById('conversation');
        const spinner = document.getElementById('spinner');
        conversation.insertBefore(elt, spinner);
      }
      conversation.scrollTop = conversation.scrollHeight;
    }

    // Handle form submission
    document.getElementById('messageInput').addEventListener('keypress', async function(event) {
      if (event.key != 'Enter')
        return;

      event.preventDefault();
      const messageText = event.target.innerText.trim();
      if(messageText === "") return;

      const conversation = document.getElementById('conversation');

      // Append user's message
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = messageText;
      conversation.appendChild(userMessage);
      
      // Add initial spinner
      const spinner = document.createElement('div');
      spinner.id = 'spinner';
      conversation.appendChild(spinner);
      
      conversation.scrollTop = conversation.scrollHeight;

      // Clear the input field
      event.target.innerText = "";

      handleEventStream(
        "/api/chat",
        {type: "text", text: messageText},
        handleChatResponse,
        () => {document.getElementById('spinner').remove()}
      );
    });

    // Load conversation history when the page loads
    loadConversationHistory();
  </script>
</body>
</html>
